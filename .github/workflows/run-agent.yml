name: Run Autonomous Agent

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  schedule:
    - cron: '0 */6 * * *' # Automatically runs every 6 hours

jobs:
  run-agent:
    runs-on: [self-hosted, linux, x64]

    permissions:
      contents: write # Grants permission to commit changes back to your repo

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ollama duckduckgo-search gitpython

      - name: Install and Start Ollama Engine
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The ollama server and model pull are heavy operations and should run only on self-hosted runners.
          # The following lines are left for self-hosted environments where sufficient resources exist:
          ollama serve &
          sleep 5
          ollama pull llama3:8b

      - name: Run Autonomous Agent Cycle
        run: |
          python main.py

      - name: Save Memory and Code Changes Back to GitHub
        run: |
          git config --global user.name "GitHub Agent Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --quiet || (git commit -m "Automated agent execution and memory update" && git push)
